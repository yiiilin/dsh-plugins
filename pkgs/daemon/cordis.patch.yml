# One Loader layer for this package. Installed standalone from GitHub;
# `dsh plugin --profile <p> add github:<owner>/<repo>#path:/pkgs/daemon`.
- insert:
    - id: daemon
      name: '@yiln-dsh/dsh-daemon'
      config:
        # The panel's own listener. TLS is terminated by an external proxy.
        host: 0.0.0.0
        port: 3080
        # main: accepts tunnels from edges and can list/switch environments.
        # edge: dials a main node; manages no environments of its own.
        role: main
        # Edge only: where the main node is, and which environment this is.
        mainUrl: ''
        token: ''
        # Environment registry. Holds tokens, so it is written 0600.
        registryPath: !!js dshHomePath('daemon/environments.json')
        homeDir: !!js dshHomePath()
        cacheDir: !!js dshHomePath('daemon/cache')
        # This process's own harness, mounted behind the panel. Every dsh — main or
        # edge — has one; the difference is only what the panel adds around it.
        rootEmbedded: true
        # Prefix the harness is served under. Empty serves it at the origin root, which
        # is what an edge wants: its UI should look like a plain dsh.
        rootPrefix: ''
        # Empty hides the panel's restart control. Name this deployment's own unit to
        # enable it; a guess would restart the wrong service.
        selfUnit: ''
        # Login for this listener. Falls back to AUTH_USER / AUTH_PASS when empty, so an
        # existing deployment keeps the credentials it already has.
        username: admin
        password: ''
