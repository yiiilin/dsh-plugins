# One Loader layer for this package. Installed standalone from GitHub;
# `dsh plugin --profile <p> add github:<owner>/<repo>#path:/pkgs/tool-restrict-presets`.
- insert:
    - id: tool-restrict-presets
      name: '@yiln-dsh/dsh-tool-restrict-presets'
      inject:
        - tools
        - agents
        - agentPresets
      config:
        presets: []
        verbose: false
