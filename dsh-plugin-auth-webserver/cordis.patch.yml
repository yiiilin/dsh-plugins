# dsh-plugin-auth-webserver bundle patch.
#
# The stock webserver stays enabled and keeps serving 127.0.0.1:<port> with
# DSH core browser authentication. This bundle instead mounts an auth-gated
# reverse proxy on every non-loopback NIC address at the same port, forwarding
# accepted requests to 127.0.0.1:<port> — so LAN clients get the full DSH web
# UI behind gateway authentication while the core session exchange stays
# internal to the gateway.

- insert:
    - id: webserver-auth
      name: '@yiln-dsh/dsh-plugin-auth-webserver'
      inject:
        - webStartup
        - webServer
        - settings
        - connection
      config:
        port: !!js ctx.webStartup.port ?? 3080
        targetHost: '127.0.0.1'
        targetPort: !!js ctx.webStartup.port ?? 3080
        username: 'admin'
        password: ''
