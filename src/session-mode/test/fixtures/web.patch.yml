# Isolated browser fixture: never apply this overlay to the production profile.
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      mode-qa:
        api: openai-responses
        baseURL: http://127.0.0.1:9/v1
        apiKeyEnv: DSH_MODE_TEST_API_KEY
        models:
          - id: mode-fixture
            name: Mode fixture
            contextWindow: 32000
            maxTokens: 4096
- id: agent-default-model
  config:
    provider: mode-qa
    model: mode-fixture
- id: webserver-auth
  disabled: true
- id: web-daemon
  disabled: true
- id: session-mode
  config:
    normalPrompt: 'QA normal executor prompt.'
    delegateWritesPrompt: 'QA delegate-writes coordinator prompt.'
