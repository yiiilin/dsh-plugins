# dsh-plugin-original-models-page-patch bundle patch.
#
# Adds a single Host-only row that patches the official settings bundle and
# routes settings/credentials RPCs through the Host services.

- insert:
    - id: original-models-page-patch
      name: 'dsh-plugin-original-models-page-patch'
      inject:
        - settings
        - webServer
        - clientModules
